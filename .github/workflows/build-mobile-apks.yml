name: Build Mobile APKs

# Build file .apk cho cac app di dong (Expo / React Native):
#   - CE Staff : app nhan vien (shipper, kho, dieu phoi, ke toan, CSKH, quan ly) – thu muc StaffApp-Mobile
#   - CE Shop  : app khach hang (shop) – thu muc ShopApp-Mobile
# Chay: tab Actions -> Build Mobile APKs -> Run workflow. Tai file o muc Artifacts cuoi trang ket qua.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App can build"
        type: choice
        options: [tat-ca, staff, shop]
        default: tat-ca
      server_url:
        description: "Dia chi may chu mac dinh (VD http://192.168.1.10:5180) - de trong cung duoc"
        required: false
        default: ""

jobs:
  chon-app:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          STAFF='{"key":"staff","pkg":"courier-express-staff","apk":"CE-Staff"}'
          SHOP='{"key":"shop","pkg":"courier-express-shop","apk":"CE-Shop"}'
          case "${{ github.event.inputs.app }}" in
            staff) echo "matrix={\"include\":[$STAFF]}" >> $GITHUB_OUTPUT ;;
            shop)  echo "matrix={\"include\":[$SHOP]}" >> $GITHUB_OUTPUT ;;
            *)     echo "matrix={\"include\":[$STAFF,$SHOP]}" >> $GITHUB_OUTPUT ;;
          esac

  android:
    needs: chon-app
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.chon-app.outputs.matrix) }}
    name: ${{ matrix.apk }}
    steps:
      - uses: actions/checkout@v5

      - name: Tim thu muc app
        run: |
          PKG=$(grep -rl --include=package.json "\"name\": *\"${{ matrix.pkg }}\"" . 2>/dev/null | grep -v node_modules | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::Khong tim thay ma nguon app ${{ matrix.apk }} (package.json co name = ${{ matrix.pkg }}) trong repo. Hay upload thu muc app len repo."
            find . -maxdepth 2 -not -path './.git*' | sort | head -n 100
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "APP_DIR=$GITHUB_WORKSPACE/${DIR#./}" >> $GITHUB_ENV
          echo "Thu muc app: $DIR"

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Kiem tra Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || (echo "::error::Khong co Android SDK tren may build" && exit 1)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cai thu vien
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npx expo install expo-asset expo-font expo-constants
          npx expo install --fix
          npx expo install --check || true

      - name: Dat dia chi may chu
        if: ${{ github.event.inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          cd "$APP_DIR"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json'));j.expo.extra=j.expo.extra||{};j.expo.extra.defaultServerUrl=process.env.SERVER_URL;fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      - name: Tao project Android
        run: |
          cd "$APP_DIR"
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-out/${{ matrix.apk }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}-apk
          path: apk-out/*.apk
          retention-days: 30
